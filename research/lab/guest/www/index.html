<main>
  <h1>Sandbox screenshot check</h1>

  <p lang="ja">日本語の表示テスト。サンドボックス内のブラウザで漢字、ひらがな、カタカナが正しく描画されるか確認します。</p>
  <svg width="420" height="140" viewBox="0 0 420 140" role="img" aria-label="shapes">
    <circle cx="70" cy="70" r="60" fill="#e53935"/>
    <rect x="160" y="10" width="120" height="120" fill="#fdd835"/>
    <polygon points="350,10 410,130 290,130" fill="#43a047"/>

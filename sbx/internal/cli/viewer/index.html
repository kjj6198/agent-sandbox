<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<title>sbx {{ID}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font: 12px -apple-system, system-ui, sans-serif; }
  #screen { position: absolute; inset: 0; }
  #bar { position: absolute; bottom: 6px; right: 6px; z-index: 1; display: flex;
    flex-direction: row-reverse; gap: 6px; align-items: center; opacity: 0.6;
    transition: opacity 150ms ease-out; }
  #bar:hover { opacity: 1; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer;
    background: #333; color: #eee; }
  button.control { background: #c2410c; color: #fff; }
  #status { color: #bbb; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="bar">
  <button id="toggle" title="Switch between watching and controlling the sandbox"></button>
  <span id="status"></span>
</div>
<script type="module">
import RFB from "./novnc/core/rfb.js";

const screen = document.getElementById("screen");
const toggle = document.getElementById("toggle");
const status = document.getElementById("status");
let rfb;
let control = false;

function render() {
  toggle.textContent = control ? "Controlling" : "Watching";
  toggle.className = control ? "control" : "";
  if (rfb) rfb.viewOnly = !control;
}

function connect() {
  status.textContent = "connecting";
  rfb = new RFB(screen, `ws://${location.host}/ws`);
  rfb.scaleViewport = true;
  rfb.background = "#111";
  render();
  rfb.addEventListener("connect", () => { status.textContent = ""; });
  rfb.addEventListener("disconnect", async () => {
    const alive = await fetch("/alive").then((r) => r.status).catch(() => 0);
    if (alive === 410) {
      status.textContent = "sandbox removed";
      return;
    }
    status.textContent = "reconnecting";
    setTimeout(connect, 1000);
  });
}

toggle.addEventListener("click", () => {
  control = !control;
  render();
  if (control) rfb.focus();
});

connect();
</script>
</body>
</html>
